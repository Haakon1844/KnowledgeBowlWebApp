<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Knowledge Bowl Practice Quiz</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#201d18;--sub:#6b645a;--accent:#9a3b2d;--line:#e4e0d6;--good:#2d6a4f;--bad:#b4392c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--panel:#1f1c17;--ink:#ece7dd;--sub:#a39b8c;--accent:#d97a5f;--line:#322d24;--good:#5fae92;--bad:#e07a6b}}
:root[data-theme="dark"]{--bg:#15130f;--panel:#1f1c17;--ink:#ece7dd;--sub:#a39b8c;--accent:#d97a5f;--line:#322d24;--good:#5fae92;--bad:#e07a6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Iowan Old Style',serif}
.wrap{max-width:680px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.15rem;margin:22px 0 10px}
.sub,.meta{color:var(--sub);font-family:-apple-system,system-ui,sans-serif;font-size:.88rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin:16px 0}
.ui{font-family:-apple-system,system-ui,sans-serif}
.cat{text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--accent);font-weight:700;margin-bottom:8px;font-family:-apple-system,system-ui,sans-serif}
.q{font-size:1.15rem;line-height:1.5;margin:0 0 16px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);color:var(--ink);padding:12px 14px;border-radius:8px;margin-bottom:9px;font-family:-apple-system,system-ui,sans-serif;font-size:.96rem;cursor:pointer}
.opt:hover{border-color:var(--accent)}.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.opt b{color:var(--sub);min-width:1.2em}
button.primary{background:var(--accent);color:#fff;border:none;padding:11px 22px;border-radius:8px;font-family:-apple-system,system-ui,sans-serif;font-weight:600;font-size:.95rem;cursor:pointer}
button.primary:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:8px;font-family:-apple-system,system-ui,sans-serif;font-size:.9rem;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label.chk{display:flex;gap:10px;align-items:center;padding:8px 0;font-family:-apple-system,system-ui,sans-serif;font-size:.95rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 18px}.bar i{display:block;height:100%;background:var(--accent)}
.big{font-size:3rem;font-weight:700;color:var(--accent);line-height:1}
.brow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-family:-apple-system,system-ui,sans-serif;font-size:.92rem}
.rev{border-top:1px solid var(--line);padding:14px 0;font-family:-apple-system,system-ui,sans-serif;font-size:.92rem;line-height:1.5}
.rev .rq{font-family:Georgia,serif;font-size:1rem;margin-bottom:6px}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 Knowledge Bowl Practice Quiz</h1>
  <div class="sub">Answer every question, then get graded at the end.</div>
  <div id="app"></div>
</div>
<script>
const QUESTIONS = [{"g": "Mixed topics (from the practice packet)", "c": "European Rivers", "q": "Which European river flows from Germany through Vienna, Austria, before emptying into the Black Sea?", "o": ["Danube", "Rhine", "Elbe", "Oder"]}, {"g": "Mixed topics (from the practice packet)", "c": "Wars", "q": "The Crimean War, which began in 1853, pitted Russia against which empire and its allies (including Britain and France)?", "o": ["Ottoman Empire", "Austro-Hungarian Empire", "Persian Empire", "Mughal Empire"]}, {"g": "Mixed topics (from the practice packet)", "c": "Civil Unrest", "q": "The 1992 Los Angeles riots were sparked by the acquittal of police officers in the videotaped beating of whom?", "o": ["Rodney King", "Emmett Till", "Amadou Diallo", "Ron Settles"]}, {"g": "Mixed topics (from the practice packet)", "c": "Chemistry", "q": "In a neutralization reaction, an acid reacts with a base to form water and what else?", "o": ["A salt", "A gas", "A metal", "An alcohol"]}, {"g": "Mixed topics (from the practice packet)", "c": "Thermodynamics", "q": "Which law of thermodynamics states that it is impossible to cool a body all the way to absolute zero?", "o": ["Third law", "Zeroth law", "First law", "Second law"]}, {"g": "Mixed topics (from the practice packet)", "c": "Human Senses", "q": "Equilibrioception, the sense that lets you maintain balance, relies primarily on structures in which organ?", "o": ["Inner ear", "Eyes", "Skin", "Lungs"]}, {"g": "Mixed topics (from the practice packet)", "c": "Colonial Legislation", "q": "Maryland’s 1649 “Act Concerning Religion,” often called the Toleration Act, was notable because it provided for what?", "o": ["Freedom of worship", "Abolition of slavery", "Universal male suffrage", "Trial by jury"]}, {"g": "Mixed topics (from the practice packet)", "c": "Direct Variation", "q": "If y varies directly as x, and y = 10 when x = 7, what is the constant of proportionality?", "o": ["10/7", "7/10", "17", "70"]}, {"g": "Mixed topics (from the practice packet)", "c": "Modals", "q": "Which of the following is NOT one of the three modal auxiliary verbs that begin with the letter “m”?", "o": ["move", "may", "might", "must"]}, {"g": "Mixed topics (from the practice packet)", "c": "Art History", "q": "William Blake mockingly nicknamed which 18th-century English portrait painter “Sir Sloshua”?", "o": ["Joshua Reynolds", "Thomas Gainsborough", "George Romney", "John Constable"]}, {"g": "Mixed topics (from the practice packet)", "c": "Seas", "q": "The Caspian Sea lies between which two countries?", "o": ["Azerbaijan and Turkmenistan", "Iran and Iraq", "Turkey and Greece", "Russia and Ukraine"]}, {"g": "Mixed topics (from the practice packet)", "c": "Cosmic Rays", "q": "Nearly 90% of cosmic rays entering Earth’s atmosphere consist of which subatomic particles?", "o": ["Protons", "Electrons", "Neutrons", "Positrons"]}, {"g": "Mixed topics (from the practice packet)", "c": "Canadian Geography", "q": "Wood Buffalo National Park, Canada’s largest national park, is located mainly in which province?", "o": ["Alberta", "Saskatchewan", "Manitoba", "British Columbia"]}, {"g": "Mixed topics (from the practice packet)", "c": "Novels", "q": "Bernard Malamud’s novel about a gifted young athlete wounded by a deranged woman obsessed with the sport’s best player is titled what?", "o": ["The Natural", "Shoeless Joe", "The Boys of Summer", "Field of Dreams"]}, {"g": "Mixed topics (from the practice packet)", "c": "Geometric Solids", "q": "Which Platonic solid is the only one with no parallel faces?", "o": ["Tetrahedron", "Cube", "Octahedron", "Dodecahedron"]}, {"g": "Mixed topics (from the practice packet)", "c": "Psychological Terms", "q": "An involuntary, repetitive muscle movement such as eye twitching or blinking is medically known as what?", "o": ["A tic", "A spasm", "A seizure", "A tremor"]}, {"g": "Mixed topics (from the practice packet)", "c": "U.S. Civics", "q": "Besides the 435 voting House members from the states, which territory sends a nonvoting delegate, alongside D.C., American Samoa, and Guam?", "o": ["U.S. Virgin Islands", "Northern Mariana Islands", "Marshall Islands", "Midway Islands"]}, {"g": "Mixed topics (from the practice packet)", "c": "Stream Erosion", "q": "The type of stream erosion in which collapsing bubbles create shock waves that help wear away channel walls is called what?", "o": ["Cavitation", "Abrasion", "Hydraulic action", "Solution"]}, {"g": "Mixed topics (from the practice packet)", "c": "Early American Politics", "q": "Aaron Burr’s political ambitions were twice thwarted by the same rival — first in the 1800 presidential contest, then in an 1804 New York governor’s race. Who was the rival?", "o": ["Alexander Hamilton", "Thomas Jefferson", "James Madison", "John Adams"]}, {"g": "Mixed topics (from the practice packet)", "c": "Ancient Peoples", "q": "The Etruscans were an ancient people named for the region they settled on which peninsula?", "o": ["Italian Peninsula", "Iberian Peninsula", "Balkan Peninsula", "Anatolian Peninsula"]}, {"g": "Mixed topics (from the practice packet)", "c": "World War I", "q": "Germany allowed which exiled revolutionary to return to Russia in 1917, hoping to further destabilize the country?", "o": ["Vladimir Lenin", "Leon Trotsky", "Joseph Stalin", "Karl Marx"]}, {"g": "Mixed topics (from the practice packet)", "c": "Lighting Technology", "q": "Fluorescent lighting works by absorbing energy from what type of light and re-emitting it as visible light?", "o": ["Ultraviolet light", "Infrared light", "X-rays", "Microwaves"]}, {"g": "Mixed topics (from the practice packet)", "c": "Mineral Deposits", "q": "Dense, chemically inert minerals that resist weathering often collect in what kind of alluvial deposit?", "o": ["Placer deposits", "Evaporite deposits", "Igneous deposits", "Sedimentary basins"]}, {"g": "Mixed topics (from the practice packet)", "c": "Body Disorders", "q": "Acute renal failure causes which organs to cease functioning?", "o": ["Kidneys", "Lungs", "Liver", "Pancreas"]}, {"g": "Mixed topics (from the practice packet)", "c": "Averages", "q": "What is the average of all the integers from 19 to 41, inclusive?", "o": ["30", "29", "31", "32"]}, {"g": "Mixed topics (from the practice packet)", "c": "Logical Fallacies", "q": "Restating a claim as its own proof — e.g., “begging the question is fallacious, therefore to beg the question is to argue fallaciously” — is an example of what kind of reasoning?", "o": ["Circular reasoning", "Straw man", "False dilemma", "Slippery slope"]}, {"g": "Mixed topics (from the practice packet)", "c": "Dystopian Literature", "q": "In George Orwell’s “1984,” Winston Smith works at the ministry that rewrites history to fit party doctrine. What is it called?", "o": ["Ministry of Truth", "Ministry of Peace", "Ministry of Love", "Ministry of Plenty"]}, {"g": "Mixed topics (from the practice packet)", "c": "Volcanic Activity", "q": "Pea-sized pyroclastic fragments ejected from a volcano are known by what term?", "o": ["Cinders", "Lapilli", "Volcanic bombs", "Ash"]}, {"g": "Mixed topics (from the practice packet)", "c": "World War II", "q": "Just a week after signing a nonaggression pact with the Soviet Union, Germany invaded which country in 1939, starting the European war?", "o": ["Poland", "Czechoslovakia", "France", "Belgium"]}, {"g": "Mixed topics (from the practice packet)", "c": "Etymology", "q": "The English words “confetti,” “fiasco,” and “regatta” were all borrowed from which language?", "o": ["Italian", "Spanish", "French", "Portuguese"]}, {"g": "Art", "c": "Art", "q": "Pablo Picasso is most often associated with which art movement?", "o": ["Cubism", "Impressionism", "Abstract Expressionism", "Dada"]}, {"g": "Art", "c": "Art", "q": "Salvador Dali is most often associated with which art movement?", "o": ["Surrealism", "Post-Impressionism", "Pop Art", "Baroque"]}, {"g": "Art", "c": "Art", "q": "Jackson Pollock is most often connected to which art movement?", "o": ["Abstract Expressionism", "Impressionism", "Post-Impressionism", "Pop Art"]}, {"g": "Art", "c": "Art", "q": "The Dada art movement began in which city?", "o": ["Zurich, Switzerland", "Berlin, Germany", "New York, USA", "Tokyo, Japan"]}, {"g": "Art", "c": "Art", "q": "The Dadaist began as a group of artists protesting what human event?", "o": ["World War I", "World War II", "Climate Change", "Women’s Suffrage"]}, {"g": "Art", "c": "Art", "q": "The popularity of The Mona Lisa is often tied to:", "o": ["Being stolen from the Louvre", "The last painting by Rembrandt", "The first Impressionist painting", "Having been owned by Marie Antoinette"]}, {"g": "Art", "c": "Art", "q": "What body part did Vincent Van Gogh send to a woman to profess his love for her?", "o": ["An ear", "A finger", "A toe", "A bone fragment from his hip"]}, {"g": "Art", "c": "Art", "q": "Henri Rousseau is most often associated with which art movement?", "o": ["Post impressionism", "Minimalism", "Realism", "Pointillism"]}, {"g": "Art", "c": "Art", "q": "Which of the following individuals was rejected from art school before leading a country?", "o": ["Adolf Hitler", "Joseph Stalin", "Winston Churchill", "Dwight D. Eisenhower"]}, {"g": "Art", "c": "Art", "q": "Wassily Kandinsky was a well-known Russian artist whose paintings were rejected by Stalin because:", "o": ["They were said to be bourgeoisie art", "They were created in Germany", "They lacked originality", "They did not focus on the agricultural traditions of Russia"]}, {"g": "Art", "c": "Art", "q": "Judy Chicago created which masterpiece to celebrate famous women throughout history?", "o": ["The Dinner Party", "Lady Liberty Leading the People", "Olympia", "American Gothic"]}, {"g": "Art", "c": "Art", "q": "American Gothic portrays a man holding a pitchfork and his:", "o": ["Daughter", "Sister", "Wife", "Mother"]}, {"g": "Art", "c": "Art", "q": "Diego Rivera, a renowned muralist from Mexico, painted what mural at the entrance of the Detroit Institute of Arts?", "o": ["Detroit Industry Murals", "The Founding of the Automobile", "The History of the Great Lakes and its People", "The Sinking of the Edmund Fitzgerald"]}, {"g": "Art", "c": "Art", "q": "What was the name of Andy Warhol’s New York City studio?", "o": ["The Factory", "The Pop Art Collective", "The Happening", "The Village"]}, {"g": "Art", "c": "Art", "q": "What painting did Pablo Picasso create to memorialize the Spanish Civil War of 1936-1939?", "o": ["Guernica", "The Kiss", "The Old Guitarist", "Three Musicians"]}, {"g": "Art", "c": "Art", "q": "Eva Hesse is best known for her work in what medium?", "o": ["Textiles", "Paint", "Oil Pastels", "Ceramics"]}, {"g": "Art", "c": "Art", "q": "Bill Viola is best known for his work with which medium?", "o": ["Video", "Sounds waves", "Paper mache", "Silicon"]}, {"g": "Art", "c": "Art", "q": "Man Ray is best known for his work in which medium?", "o": ["Photography", "Clay", "Marble", "Oil paint"]}, {"g": "Art", "c": "Art", "q": "Who was Gala Dali married to before marrying Salvador Dali?", "o": ["Paul Eluard", "Marcel Duchamp", "Hugo Ball", "Sophie Taeuber"]}, {"g": "Art", "c": "Art", "q": "What art school were Paul Klee and Wassily Kandinsky connected to prior to World War II?", "o": ["Bauhaus", "Frankfurt School", "Birmingham School", "Royal College of Art"]}, {"g": "Art", "c": "Art", "q": "Which is the oldest art museum in the US?", "o": ["Pennsylvania Academy of the Fine Arts", "Chicago Institute of Art", "Guggenheim Museum", "Whitney Museum"]}, {"g": "Art", "c": "Art", "q": "Many people might refer to Marcel Duchamps The Fountain as a:", "o": ["Bathroom urinal", "Drinking fountain", "Soda dispenser", "Kitchen Sink"]}, {"g": "Art", "c": "Art", "q": "The technique of glassblowing was founded in:", "o": ["The Palestinian region around 50 BC", "Athens, Greece around 400 BC", "Jerusalem around 50 AD", "Nicaea around 400 AD"]}, {"g": "Art", "c": "Art", "q": "Gold is often used to make what color of glass?", "o": ["Pink", "Yellow", "Blue", "Green"]}, {"g": "Art", "c": "Art", "q": "Who was the German-born artist who used surveillance technology in his artwork such as Not a Model for Big Brother Spy Cycle?", "o": ["Dieter Froese", "Albrecht Dürer", "Emil Nolde", "Otto Dix"]}, {"g": "Sports", "c": "Sports", "q": "What was Babe Ruth’s middle name?", "o": ["Herman", "George", "Fredrick", "Horace"]}, {"g": "Sports", "c": "Sports", "q": "What year did Bill Willis, Marion Motley, Kenny Washington, and Woody Strode break the color barrier in American professional football?", "o": ["1946", "1947", "1933", "1951"]}, {"g": "Sports", "c": "Sports", "q": "Which was the first AFL team to win a Super Bowl?", "o": ["New York Jets", "Baltimore Colts", "Cleveland Browns", "Kansas City Chiefs"]}, {"g": "Sports", "c": "Sports", "q": "When was the last Super Bowl to feature a team from the AFL and the NFL?", "o": ["1970", "1969", "2000", "2026"]}, {"g": "Sports", "c": "Sports", "q": "Which company was the first to pay $1,000,000 for a Super Bowl advertisement?", "o": ["Anheuser-Busch", "Porsche", "Doritos", "McDonalds"]}, {"g": "Sports", "c": "Sports", "q": "What years did the All-American Girls Professional Baseball League operate in the United States?", "o": ["1943-1954", "1915-1925", "1929-1939", "1970-1982"]}, {"g": "Sports", "c": "Sports", "q": "Where were the first modern day Olympics held?", "o": ["Athens, Greece", "New York, United States", "Paris, France", "London, UK"]}, {"g": "Sports", "c": "Sports", "q": "Who was the German athlete Jesse Owens defeated in the long jump in 1936 during the Olympics held in Berlin, Germany?", "o": ["Luz Long", "Julius Hirsch", "Erich Gottlieb Eliskases", "Gustav Felix Flatow"]}, {"g": "Sports", "c": "Sports", "q": "Who is the Stanley Cup named after?", "o": ["Lord Stanley of Preston", "Stanley Tucci", "Stanley Livingston", "Stanley Fafara"]}, {"g": "Sports", "c": "Sports", "q": "Which two colleges played the first intercollegiate football game?", "o": ["Princeton and Rutgers", "Army and Navy", "Notre Dame and Michigan", "Harvard and Yale"]}, {"g": "Sports", "c": "Sports", "q": "Which team won the first modern day World Series in baseball?", "o": ["Boston Americans", "Pittsburgh Pirates", "New York Yankees", "Brooklyn Dodgers"]}, {"g": "Sports", "c": "Sports", "q": "The 1927 New York Yankees boasted a batting lineup referred to as Murders’ Row. This included Earle Combs, Mark Koenig, Babe Ruth, Bob Meusel, Tony Lazzeri, and", "o": ["Lou Gehrig", "Mickey Mantle", "Joe DiMaggio", "Ted Williams"]}, {"g": "Sports", "c": "Sports", "q": "Which athlete has won the most Olympic medals?", "o": ["Michael Phelps", "Katie Ledecky", "Boris Shakhin", "Simone Biles"]}, {"g": "Sports", "c": "Sports", "q": "In 1968, pitching dominated American baseball due to players such as Bob Gibson, leading to what change in 1969?", "o": ["Lowering the pitching mound from 15 to 10 inches above home plate", "Moving the pitching mound from 55 to 60.5 feet further away from home plate", "Moving outfield fences from 250 feet to 310 feet", "Changing from two strikes for a strikeout to three strikes for a strikeout"]}, {"g": "Sports", "c": "Sports", "q": "What is the height of a basketball net in professional US basketball?", "o": ["Ten feet", "Eight feet", "Nine feet", "Eleven feet"]}, {"g": "Sports", "c": "Sports", "q": "Which country has won the most men’s World Cup titles in soccer?", "o": ["Brazil", "United States", "England", "France"]}, {"g": "Sports", "c": "Sports", "q": "Which country has won the most women’s World Cup titles in soccer?", "o": ["Unites States", "Brazil", "Japan", "Australia"]}, {"g": "Sports", "c": "Sports", "q": "When did both men and women curling teams become officially recognized as Olympic sports?", "o": ["1998", "1960", "1972", "1984"]}, {"g": "Sports", "c": "Sports", "q": "What year was the Miracle on Ice, when the US men’s hockey team defeated the USSR men’s hockey team?", "o": ["1984", "1964", "1954", "2004"]}, {"g": "Sports", "c": "Sports", "q": "In which sport is there both a bowler and a wicket?", "o": ["Cricket", "Billiards", "Bocci", "Jai-Alai"]}, {"g": "Sports", "c": "Sports", "q": "Which sport is often referred to as “The Fastest Game in the World?”", "o": ["Jai-Alai", "NASCAR", "Pickleball", "Boxcar racing"]}, {"g": "Sports", "c": "Sports", "q": "In what state was pickleball invented?", "o": ["Washington", "Florida", "California", "New York"]}, {"g": "Sports", "c": "Sports", "q": "In what sport would you find the term ‘dinger?”", "o": ["Baseball", "Football", "Soccer", "Ping Pong"]}, {"g": "Sports", "c": "Sports", "q": "The Toledo Mud Hens are the triple A affiliate of what major league baseball team?", "o": ["Detroit Tigers", "New York Yankees", "Cleveland Guardians", "Washington Nationals"]}, {"g": "Sports", "c": "Sports", "q": "In what sport might you hear the term ‘nutmeg?’", "o": ["Soccer", "American football", "Badminton", "Beach Volleyball"]}];
const app = document.getElementById('app');
const L = ['A','B','C','D'];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const groups = [...new Set(QUESTIONS.map(q => q.g))];
let quiz = null, idx = 0;

function showStart() {
  quiz = null;
  app.innerHTML = `<div class="card"><h2 style="margin-top:0">Choose your question sets</h2>
    ${groups.map(g => `<label class="chk"><input type="checkbox" class="grp" value="${esc(g)}" checked> ${esc(g)} <span class="meta">(${QUESTIONS.filter(q => q.g === g).length})</span></label>`).join('')}
    <label class="chk"><input type="checkbox" id="shufQ" checked> Shuffle question order</label>
    <p class="meta" id="count"></p>
    <button class="primary" id="startBtn">Start Quiz</button></div>`;
  const upd = () => {
    const sel = [...document.querySelectorAll('.grp:checked')].map(x => x.value);
    const n = QUESTIONS.filter(q => sel.includes(q.g)).length;
    document.getElementById('count').textContent = n + ' question' + (n === 1 ? '' : 's') + ' selected';
    document.getElementById('startBtn').disabled = n === 0;
  };
  document.querySelectorAll('.grp').forEach(x => x.onchange = upd); upd();
  document.getElementById('startBtn').onclick = () => {
    const sel = [...document.querySelectorAll('.grp:checked')].map(x => x.value);
    let pool = QUESTIONS.filter(q => sel.includes(q.g));
    if (document.getElementById('shufQ').checked) pool = shuffle(pool);
    startQuiz(pool);
  };
}

function startQuiz(pool) {
  // options are shuffled per attempt; the correct answer is always stored first in the data
  quiz = pool.map(q => ({ q, opts: shuffle(q.o), pick: null }));
  idx = 0; renderQ();
}

function renderQ() {
  const it = quiz[idx], last = idx === quiz.length - 1;
  app.innerHTML = `<div class="meta" style="margin-top:18px">Question ${idx + 1} of ${quiz.length}</div>
    <div class="bar"><i style="width:${(idx / quiz.length) * 100}%"></i></div>
    <div class="card" style="margin-top:0"><div class="cat">${esc(it.q.c)}</div>
    <p class="q">${esc(it.q.q)}</p>
    ${it.opts.map((o, i) => `<button class="opt ${it.pick === o ? 'sel' : ''}" data-i="${i}"><b>${L[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="row" style="justify-content:space-between">
      <button class="ghost" id="prev" ${idx === 0 ? 'disabled' : ''}>← Back</button>
      <button class="primary" id="next" ${it.pick === null ? 'disabled' : ''}>${last ? 'Finish & Grade' : 'Next →'}</button></div>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => { it.pick = it.opts[+b.dataset.i]; renderQ(); });
  document.getElementById('prev').onclick = () => { if (idx > 0) { idx--; renderQ(); } };
  document.getElementById('next').onclick = () => { if (it.pick === null) return; if (last) showResults(); else { idx++; renderQ(); } };
}

function showResults() {
  const correct = quiz.filter(x => x.pick === x.q.o[0]).length, total = quiz.length;
  const pct = Math.round(correct / total * 100);
  const by = {};
  quiz.forEach(x => { const b = by[x.q.g] = by[x.q.g] || { c: 0, t: 0 }; b.t++; if (x.pick === x.q.o[0]) b.c++; });
  const missed = quiz.filter(x => x.pick !== x.q.o[0]);
  app.innerHTML = `<div class="card" style="text-align:center"><div class="big">${pct}%</div>
    <div class="ui" style="margin-top:8px">${correct} of ${total} correct</div></div>
    <div class="card"><h2 style="margin-top:0">By question set</h2>
    ${Object.entries(by).map(([g, b]) => `<div class="brow"><span>${esc(g)}</span><span>${b.c} / ${b.t}</span></div>`).join('')}</div>
    <div class="row"><button class="primary" id="again">New Quiz</button>
    <button class="ghost" id="redo" ${missed.length ? '' : 'disabled'}>Retake ${missed.length} missed</button>
    <button class="ghost" id="toggle">Show only missed</button></div>
    <div class="card" id="review">${quiz.map((x, i) => {
      const ok = x.pick === x.q.o[0];
      return `<div class="rev ${ok ? 'right' : 'wrong'}"><div class="rq">${i + 1}. ${esc(x.q.q)}</div>
        <div class="${ok ? 'ok' : 'no'}">${ok ? '✓ Correct' : '✗ Incorrect'}</div>
        <div>Your answer: ${esc(x.pick)}</div>${ok ? '' : `<div>Correct answer: <b>${esc(x.q.o[0])}</b></div>`}</div>`;
    }).join('')}</div>`;
  document.getElementById('again').onclick = showStart;
  document.getElementById('redo').onclick = () => startQuiz(shuffle(missed.map(x => x.q)));
  let only = false;
  document.getElementById('toggle').onclick = e => {
    only = !only; e.target.textContent = only ? 'Show all' : 'Show only missed';
    document.querySelectorAll('.rev.right').forEach(r => r.classList.toggle('hide', only));
  };
  window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (!quiz || document.querySelector('.big')) return;
  const it = quiz[idx], k = e.key.toLowerCase(), i = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : ('1234'.indexOf(k));
  if (i >= 0 && i < it.opts.length) { it.pick = it.opts[i]; renderQ(); }
  else if (e.key === 'Enter') { const n = document.getElementById('next'); if (n && !n.disabled) n.click(); }
});

showStart();
</script>
</body>
</html>
